## ---------- MQTT ----------
## Los dispositivos publican por MQTT en el puerto 1883.
## Cada mensaje entra al exchange amq.topic; el tópico MQTT
## "invernadero/inv-01/lecturas" se convierte en la routing key
## "invernadero.inv-01.lecturas".
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous       = false
mqtt.vhost                 = /
mqtt.exchange              = amq.topic

## ---------- Colas y bindings ----------
## Crea usuario, colas y el enlace amq.topic -> sensor.readings al arrancar.
## El archivo lo genera entrypoint.sh desde definitions.template.json.
load_definitions = /tmp/definitions.json
