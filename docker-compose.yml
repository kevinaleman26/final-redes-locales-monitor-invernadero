name: invernadero

x-python-env: &python-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
  QUEUE_NAME: ${QUEUE_NAME}
  # Datos que la página «Información» muestra para configurar los ESP32
  MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-}
  MQTT_PUBLIC_PORT: ${MQTT_PORT:-1883}
  PORTAL_AP_PASSWORD: ${PORTAL_AP_PASSWORD:-invernadero}

services:
  # ------------------------------------------------------------------ datos
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------ cola + broker MQTT
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/invernadero-entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
      - "${MQTT_PORT}:1883"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/20-invernadero.conf:/etc/rabbitmq/conf.d/20-invernadero.conf:ro
      - ./rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
      - ./rabbitmq/entrypoint.sh:/usr/local/bin/invernadero-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ------------------------------------------------------------------ backend
  backend-worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *python-env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backend-api:
    build: ./backend
    restart: unless-stopped
    environment: *python-env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ dashboard
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend-api:8000
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  pg_data:
  pgadmin_data:
  rabbitmq_data:
